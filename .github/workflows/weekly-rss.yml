name: Weekly Science Page

on:
  schedule:
    - cron: '0 9 * * 6'   # Saturday 09:00 UTC = 05:00 ET
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      # Pull the current likes.json from the repo so it's present
      # when build_page.py checks for it. If it doesn't exist yet,
      # the script will create an empty one.
      - name: Restore likes.json
        run: |
          git fetch origin main
          git checkout origin/main -- likes.json 2>/dev/null || true

      - name: Build digest page
        env:
          # GH_PAT: fine-grained PAT you created in GitHub Settings.
          # Add it as a repo secret named GH_PAT.
          # Scope: Contents read+write on THIS repo only. Nothing else.
          GH_PAT: ${{ secrets.GH_PAT }}
          # GITHUB_REPOSITORY is provided automatically by Actions (e.g. "you/brain-food")
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/build_page.py

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html rejected.html debug.json likes.json
          git commit -m "Weekly digest $(date -u +%Y-%m-%d)" || exit 0
          git push
